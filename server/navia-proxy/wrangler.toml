# NAVIA language proxy. Deploy: see README.md (npx wrangler login → secrets → deploy).
name = "navia-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Fast model: the driver hears the answer within ~1–2 s.
NAVIA_UNDERSTAND_MODEL = "claude-haiku-4-5-20251001"
# Co-pilot (/v1/copilot/complete, apps/ai-backend handler): routine turns on the
# fast model; multi-step planning on the smart one. The cloud branch defaulted the
# smart tier to Opus 5.5 — Sonnet 5 here keeps a trip question in cents.
NAVIA_AI_MODEL_FAST = "claude-haiku-4-5-20251001"
NAVIA_AI_MODEL_SMART = "claude-sonnet-5"
# Neural voices (/v1/tts): Azure AI Speech region of the AZURE_SPEECH_KEY secret.
AZURE_SPEECH_REGION = "westeurope"

# Per-device limit (abuse and cost guard): 20 questions per minute.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

# Co-pilot: one question can take several model calls (tool rounds).
[[ratelimits]]
name = "COPILOT_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 60
  period = 60

# Spoken phrases: guidance and answers, cached on the phone after the first time.
[[ratelimits]]
name = "TTS_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 60
  period = 60

# OpenStreetMap place queries passed through to Overpass mirrors.
[[ratelimits]]
name = "OVERPASS_LIMITER"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 40
  period = 60
