# Every push and pull request: types, all tests, the co-pilot replay eval
# (recorded model answers, no API key, no cost) and the proxy's types.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Types (core, backend)
        run: npm run typecheck
      - name: Types (app)
        run: npx tsc --noEmit -p apps/mobile
      - name: Tests
        run: npm test
      - name: Co-pilot eval (replay, no API)
        run: npm run eval:replay
      - name: Types (Cloudflare proxy)
        working-directory: server/navia-proxy
        run: npm ci --ignore-scripts && npx tsc --noEmit
